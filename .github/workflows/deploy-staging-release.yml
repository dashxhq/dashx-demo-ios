name: Deploy release build for staging

on:
  # Triggers the workflow on push only for the "develop" branch
  push:
    branches: [ "develop" ]
  # Allows running the deploy manually from the Actions tab
  workflow_dispatch:

jobs:
  deploy:
    name: Deploying to Testflight
    runs-on: macOS-latest
    env:
      # fastlane needs a UTF-8 locale to read xcodebuild output
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Ruby and install gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Upload release build for staging
        run: bundle exec fastlane staging_release
        env:
          APP_STORE_CONNECT_KEY_ID: '${{ secrets.APP_STORE_CONNECT_KEY_ID }}'
          APP_STORE_CONNECT_ISSUER_ID: '${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}'
          APP_STORE_CONNECT_KEY_CONTENT: '${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}'
          GIT_PRIVATE_KEY: '${{ secrets.GIT_PRIVATE_KEY }}'
          MATCH_PASSWORD: '${{ secrets.MATCH_PASSWORD }}'
